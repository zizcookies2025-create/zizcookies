<style>
/* Layout: sticky header with day picker + tab rail; each tab = entry form card on top, day's ledger table below */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --ink:#17211f; --muted:#5b6966; --line:#dbe2e0;
  --accent:#0e6b5a; --accent-ink:#ffffff; --accent-soft:#e0efeb;
  --warn:#9a5806; --warn-soft:#fbefdc; --bad:#b3261e; --bad-soft:#fbe4e2; --good:#1d7536; --good-soft:#e3f3e7;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-head:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --r:10px;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --grid:#e1e0d9; --axis:#c3c2b7;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#172120; --ink:#e5ecea; --muted:#93a29f; --line:#2a3634;
  --accent:#4fbfa6; --accent-ink:#06201a; --accent-soft:#183530;
  --warn:#e0a54a; --warn-soft:#3a2a12; --bad:#f08a82; --bad-soft:#3d1c1a; --good:#6fcf8b; --good-soft:#163222;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#2c2c2a; --axis:#383835; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#172120; --ink:#e5ecea; --muted:#93a29f; --line:#2a3634;
  --accent:#4fbfa6; --accent-ink:#06201a; --accent-soft:#183530;
  --warn:#e0a54a; --warn-soft:#3a2a12; --bad:#f08a82; --bad-soft:#3d1c1a; --good:#6fcf8b; --good-soft:#163222;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#2c2c2a; --axis:#383835; color-scheme:dark}
*{box-sizing:border-box}
.chart{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 12px 6px}
.chart svg{display:block;width:100%;min-width:620px;height:auto;font-family:var(--f-body)}
.chart .tick{fill:var(--muted);font-size:12px}
.chart .lab{fill:var(--ink);font-size:13px}
.chart .val{fill:var(--muted);font-size:12px}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--axis);stroke-width:1}
.chart .xhair{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .hit{fill:transparent;cursor:crosshair}
.chart [data-tip]{cursor:default}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);align-items:center}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-inline-end:6px;vertical-align:middle}
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.82rem;box-shadow:0 4px 16px rgba(0,0,0,.12);min-width:150px;font-variant-numeric:tabular-nums}
#tip .tr{display:flex;justify-content:space-between;gap:14px}
#tip .th{font-weight:600;margin-bottom:4px}
details.tv summary{cursor:pointer;color:var(--muted);font-size:.85rem;padding-block:4px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px 10px}
.acct{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 10px;background:var(--bg)}
.acct[hidden]{display:none!important}
.acctico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.acctico svg,.iconbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acctname{display:flex;flex-direction:column;line-height:1.2;font-size:.82rem;max-width:160px}
.acctname b,.acctname small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acctname small{color:var(--muted);font-size:.72rem}
.iconbtn{display:inline-flex;align-items:center;gap:6px}
.permlink{text-decoration:none;color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.85rem;font-weight:500;background:var(--surface)}
.permlink[hidden]{display:none!important}
#reqBadge{margin-inline-start:6px}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-left,0px))}
#lock[hidden]{display:none!important}
.lockbox{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:420px;width:100%}
.lockbody{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.lockbody form{display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px}
.pin{font-size:1.6rem;text-align:center;letter-spacing:.5em;font-variant-numeric:tabular-nums;direction:ltr}
.pinerr{color:var(--bad);font-size:.9rem;min-height:1.3em}
.brandrow{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.logo{width:64px;height:64px;border-radius:50%;background:#fff;object-fit:contain;flex:none}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand h1{font-family:var(--f-head);font-size:1.3rem;margin:0;font-weight:700;letter-spacing:0}
.brand small{color:var(--muted);font-size:.82rem}
.daybox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daybox label{color:var(--muted);font-size:.85rem}
nav{display:flex;gap:4px;overflow-x:auto;padding-block:0 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:9px 14px;border-bottom:3px solid transparent;font-weight:500}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
main{padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
.note{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:.9rem}
.note.info{background:var(--accent-soft);color:var(--accent)}
h2{font-family:var(--f-head);font-size:1.15rem;margin:0;font-weight:600;text-wrap:balance}
h3{font-family:var(--f-head);font-size:1rem;margin:0;font-weight:600}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sechead .sub{color:var(--muted);font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .lb{color:var(--muted);font-size:.82rem;display:flex;align-items:center;gap:8px;margin-bottom:4px}
nav a.navcalc{display:inline-flex;align-items:center;gap:6px}
nav a.navcalc svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.calcres td b{font-size:1.05em}
.ico{width:32px;height:32px;border-radius:9px;display:inline-grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);flex:none}
.ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kpis.big .kpi .v{font-size:1.8rem}
.kpis.big .kpi{border-top:3px solid var(--c)}
.kpi .v{font-family:var(--f-head);font-size:1.55rem;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.kpi.neg .v{color:var(--bad)} .kpi.pos .v{color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:20px}
form.entry{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:.82rem;color:var(--muted);font-weight:500}
.fld.wide{grid-column:1/-1}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=date]{width:auto}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,nav a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;font-weight:500}
button:hover{border-color:var(--muted)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.pri:hover{filter:brightness(1.08)}
button.sm{padding:4px 10px;font-size:.85rem}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);border-color:var(--line)}
button.del.armed{background:var(--bad);border-color:var(--bad);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
td.wrap{white-space:normal;min-width:160px}
th{font-size:.8rem;color:var(--muted);font-weight:600;background:var(--bg)}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0;background:var(--bg)}
td.n,th.n{text-align:end}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:600}
.chip.new{background:var(--accent-soft);color:var(--accent)}
.chip.prog{background:var(--warn-soft);color:var(--warn)}
.chip.done{background:var(--good-soft);color:var(--good)}
.chip.low{background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.muted{color:var(--muted)}
.lines{display:flex;flex-direction:column;gap:8px;grid-column:1/-1}
.line{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto auto;gap:8px;align-items:center}
.line .u{color:var(--muted);font-size:.85rem;min-width:40px}
.statussel{width:auto;padding:3px 6px;font-size:.85rem}
.ro{opacity:.6;pointer-events:none}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
[hidden]{display:none!important}
.tbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:90px}
.tbar>i{display:block;height:100%;border-radius:99px}
.linkbtn{background:none;border:0;color:var(--accent);padding:4px;cursor:pointer;font:inherit;text-decoration:underline}
.lockbody input[type=email],.lockbody input[type=text]{font-size:1rem;text-align:start;direction:ltr}
.lockbody input.pin{font-size:1.05rem;letter-spacing:normal;text-align:start}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;font-size:.9rem}
.tag{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-inline-start:6px}
@media (prefers-reduced-motion:no-preference){button,nav a{transition:background .15s,color .15s,border-color .15s}}
@media (max-width:560px){.line{grid-template-columns:minmax(0,1fr) 90px auto}.line .u{display:none}.kpi .v{font-size:1.3rem}}
</style>
</head>
<body>
<div dir="rtl" lang="ar">
<header>
  <div class="wrap top">

</header>

<script>
const COLS=['products','materials','orders','issues','sales','returns','collections','meta','calcs','targets','changes'];
const S={products:[],materials:[],orders:[],issues:[],sales:[],returns:[],collections:[],meta:[],calcs:[],targets:[],changes:[]};
let PROFILES=[],MYPROFILE=null,SB=null;
/* ---------- roles: the owner holds everything; each person gets one role assigned by the owner ---------- */
const ROLES={admin:'مدير (كل الصلاحيات)',production:'الإنتاج',rep:'مندوب',accounting:'المحاسبة',viewer:'مشاهدة فقط'};
const ROLE_DESC={admin:'كل التبويبات وكل العمليات ما عدا إدارة الصلاحيات',production:'الطلبات واعتماد المتأخر منها، صرف المواد، حاسبة الإنتاج، عرض الأصناف',rep:'يشوف ويسجّل طلباته هو فقط، ويشوف مبيعاته ومرتجعات وتحصيلات عملائه فقط، بدون بيانات باقي المناديب',accounting:'المبيعات والمرتجعات والتحصيلات والرسوم البيانية والتقارير',viewer:'يشوف كل شيء بدون أي تعديل'};
const ROLE_TABS={owner:'*',admin:'*',production:['today','orders','issues','calc','items','charts','changes'],rep:['today','orders','sales','returns','collections','targets','changes'],accounting:['today','sales','returns','collections','targets','charts','report','changes'],viewer:['today','orders','issues','sales','returns','collections','targets','calc','items','charts','report'],none:[]};
const ROLE_WRITE={owner:'*',admin:['orders','approve','issues','returns','collections','items','calc','sales','targets','changes'],production:['orders','approve','issues','calc','changes'],rep:['orders','changes'],accounting:['returns','collections','changes'],viewer:[],none:[]};
const COL_KEY={orders:'orders',issues:'issues',sales:'sales',returns:'returns',collections:'collections',products:'items',materials:'items',meta:'calc',calcs:'approve',targets:'targets',changes:'changes'};
let IS_OWNER=false,MYEMAIL='';
const lc=s=>String(s||'').trim().toLowerCase();
/* role and linked rep come from the signed-in user's profile row */
const myAssign=()=>MYPROFILE?{role:MYPROFILE.role,rep:MYPROFILE.rep,name:MYPROFILE.name}:null;
function myRole(){if(!MYPROFILE)return 'none';return MYPROFILE.role==='owner'?'owner':(ROLES[MYPROFILE.role]?MYPROFILE.role:'none')}
const canTab=v=>{if(v==='users')return myRole()==='owner';const t=ROLE_TABS[myRole()];return t==='*'||(t||[]).includes(v)};
const canDo=k=>{const t=ROLE_WRITE[myRole()];return t==='*'||(t||[]).includes(k)};
const METHODS={cash:'نقدي',bank:'تحويل بنكي',card:'شبكة',cheque:'شيك'};
const userName=u=>{const m=S.meta.find(x=>x.id==='users');return (m&&m.users&&m.users[u])||u||'غير محدد'};
const STATUS={new:'جديد',prog:'قيد التنفيذ',done:'مكتمل'};
const REASONS=['تالف','منتهي الصلاحية','خطأ في الطلب','عدم مطابقة الجودة','أخرى'];
const LKEY='daily-system-v1';
let db=null, downloads=null, mode='loading', canWrite=true, note='', loaded=new Set();
let view='today', day=todayISO();
let draft={issueLines:[{m:'',q:''}], issueOrder:'', bom:[], editProduct:null, editMaterial:null, repFrom:'', repTo:''};
let skipRestore=false;

function todayISO(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}

function byUser(s,r,c){const U={};const g=u=>U[u]=U[u]||{u,sv:0,rv:0,sn:0,rn:0,cv:0,n:0};
  const m=S.meta.find(x=>x.id==='users');if(m&&m.users)Object.keys(m.users).filter(k=>k!=='0').forEach(g);
  s.forEach(x=>{const o=g(x.user||'');o.sv+=gval(x);o.sn+=nval(x)});
  r.forEach(x=>{const o=g(x.user||'');o.rv+=gval(x);o.rn+=nval(x)});
  c.forEach(x=>{g(x.user||'').cv+=num(x.amount)});
  new Set(s.map(x=>(x.user||'')+'|'+x.invoice)).forEach(k=>{g(k.split('|')[0]).n++});

const REVIEW_COLS=['orders','issues','products','materials','targets','sales','returns','collections'];
async function put(col,obj,opts){
  if(!canWrite){toast('ليست لديك صلاحية التعديل على هذا النظام');return false}
  if(!canDo(COL_KEY[col]||col)){toast('صلاحيتك لا تسمح بهذا التعديل. راجع مدير النظام');return false}
  const exists=!!obj.id&&RAW[col]&&RAW[col].has(obj.id);
  if(exists&&REVIEW_COLS.includes(col)&&!(opts&&opts.flow))return reviewChange(col,'edit',RAW[col].get(obj.id),obj);
  return rawPut(col,obj);
}
async function rawPut(col,obj){
  obj={...obj}; delete obj._by; obj.id=obj.id||uid(); obj.updatedAt=Date.now(); if(!obj.createdAt) obj.createdAt=Date.now();
  const exists=RAW[col]&&RAW[col].has(obj.id);
  const q=exists?SB.from('docs').update({data:obj}).eq('col',col).eq('id',obj.id).select():SB.from('docs').insert({col,id:obj.id,data:obj}).select();
  const {data,error}=await q;
  if(error||!data||!data.length){handleErr(error);return false}
  applyRow(data[0]);render();return true;
}
async function del(col,id){

}

/* ---------- boot: sign-in first, then load data and listen for live changes ---------- */
let RT=null;
async function boot(){
  $('#day').value=day; view=(location.hash.slice(1)||'today');
  const cfg=window.ZIZ_CONFIG||{};
  if(!window.supabase||!cfg.url||!cfg.key||/YOUR_/.test(cfg.url+cfg.key)){showAuth('config');return}
  SB=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  mode='cloud';showAuth('checking');
  SB.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY'){showAuth('recover');return}
    if(ev==='SIGNED_OUT'){stopData();showAuth('login');}
  });
  const {data:{session}}=await SB.auth.getSession();

}
async function startData(session){
  ME=session.user.id;MYEMAIL=lc(session.user.email);
  showAuth('checking');
  try{await loadProfiles();await loadAll()}catch(e){showAuth('login',{err:'تعذر تحميل البيانات. تحقق من الاتصال وأعد المحاولة'});return}
  loaded=new Set(COLS);
  if(RT)SB.removeChannel(RT);
  RT=SB.channel('ziz-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{if(p.eventType==='DELETE')applyRow(p.old,true);else applyRow(p.new);render()})
    .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},async()=>{await loadProfiles();render()})
    .subscribe();
  unlock();
}
function stopData(){if(RT&&SB){SB.removeChannel(RT);RT=null}COLS.forEach(c=>{RAW[c].clear();S[c]=[]});PROFILES=[];MYPROFILE=null;ME=null}

function capture(){const m={};document.querySelectorAll('#main [id]').forEach(el=>{if('value' in el&&el.tagName!=='BUTTON')m[el.id]=el.value});const a=document.activeElement;return{m,focus:a&&a.id&&$('#main').contains(a)?a.id:null}}

  else h+=V();

}

/* ---------- order cut-off rules ----------

   06:00-16:00 on D they are late and wait for production approval; after 16:00 D is closed. */
let USER=null, ME=null; const PROF={};
const CUT_ON=6, CUT_LATE=16;
const atHour=(iso,h)=>new Date(iso+'T'+String(h).padStart(2,'0')+':00:00').getTime();
function orderWindow(iso,ts){ts=ts||Date.now();return ts<=atHour(iso,CUT_ON)?'on':ts<=atHour(iso,CUT_LATE)?'late':'closed'}

const reqName=x=>x.user?userName(x.user):(x.client||'');

/* ---------- production calculator: recipe grams per piece x pieces -> grams, kg, packs ---------- */

/* orders -> base pieces (a box expands into its pieces) -> trays and grams per material */
function calcCompute(lines){
  const base={},prods=[],mats={},missing=[],orderRows=[];
  lines.forEach(l=>{const p=byId('products',l.p),q=num(l.q);if(!p||q<=0)return;
    const cont=(p.contents||[]).filter(c=>c.p&&num(c.n)>0);
    orderRows.push({p,q,cont});
    if(cont.length)cont.forEach(c=>{base[c.p]=(base[c.p]||0)+q*num(c.n)});else base[p.id]=(base[p.id]||0)+q});
  const T=traySize();
  Object.entries(base).forEach(([id,q])=>{const p=byId('products',id);if(!p)return;
    const bom=(p.bom||[]).filter(b=>b.m&&num(b.q)>0);if(!bom.length)missing.push(p.name);
    const gp=bom.reduce((a,b)=>a+num(b.q),0);prods.push({p,q,gp,g:gp*q,bom,trays:q/T,traysUp:Math.ceil(q/T-1e-9)});

  for(let k=missing.length-1;k>=0;k--){const p=S.products.find(x=>x.name===missing[k]);if(p&&pieceType(p))missing.splice(k,1)}
  return {orderRows,prods,mats:Object.values(mats).sort((a,b)=>b.g-a.g),missing,T};
}

/* T = {sg,sn,rg,rn,c}: sales/returns gross (with VAT) and net (before VAT), collections */
function totals(s,r,c){return{sg:s.reduce((a,x)=>a+gval(x),0),sn:s.reduce((a,x)=>a+nval(x),0),rg:r.reduce((a,x)=>a+gval(x),0),rn:r.reduce((a,x)=>a+nval(x),0),c:c.reduce((a,x)=>a+num(x.amount),0)}}
function bigTiles(T,lbl){const pct=(a,b)=>b?fmt(a/b*100)+'%':'—';return `<div class="kpis big">

  <div class="kpi pos" style="--c:var(--accent)"><span class="lb">${ic('net')}صافي المبيعات · ${lbl}</span><span class="v">${fmt(T.sg-T.rg)}</span><span class="s">شامل الضريبة · بدون الضريبة ${fmt(T.sn-T.rn)} · الضريبة ${fmt((T.sg-T.rg)-(T.sn-T.rn))}</span></div></div>`}
function mtdTiles(){const f=day.slice(0,8)+'01';
  return `<div class="sechead"><h3>من بداية الشهر حتى اليوم المختار</h3></div>`+bigTiles(totals(inRange('sales',f,day),inRange('returns',f,day),inRange('collections',f,day)),'الشهر')+`<div class="sechead"><h3>حركة اليوم</h3></div>`}

function monthDays(iso){const [y,m]=iso.split('-').map(Number);const n=new Date(y,m,0).getDate();return Array.from({length:n},(_,i)=>`${y}-${String(m).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`)}
function niceMax(v){if(!(v>0))return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
const fmtC=n=>Math.abs(n)>=1000?(n/1000).toLocaleString('en-US',{maximumFractionDigits:1})+'K':fmt(n);
const legend=series=>`<div class="legend">${series.map(s=>`<span><span class="sw" style="background:var(${s.color})"></span>${esc(s.label)}</span>`).join('')}</div>`;
function lineChart(id,days,series,last){
  const W=900,H=300,L=58,R=96,T=14,B=30,pw=W-L-R,ph=H-T-B,n=days.length;
  const max=niceMax(Math.max(0,...series.flatMap(s=>s.vals.slice(0,last+1))));
  const x=i=>L+i*pw/(n-1), y=v=>T+ph-v/max*ph;
  let g='';
  for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v).toFixed(1);g+=`<line x1="${L}" x2="${L+pw}" y1="${yy}" y2="${yy}" class="${k?'grid':'base'}"/><text x="${L-8}" y="${+yy+4}" text-anchor="end" class="tick">${fmtC(v)}</text>`}
  days.forEach((d,i)=>{const dn=+d.slice(8);if(dn===1||dn%5===0||i===n-1)g+=`<text x="${x(i).toFixed(1)}" y="${H-10}" text-anchor="middle" class="tick">${dn}</text>`});
  if(last>=0){
    series.forEach(s=>{const pts=s.vals.slice(0,last+1).map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');g+=`<polyline points="${pts}" fill="none" stroke="var(${s.color})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`});
    const ends=series.map(s=>({s,yy:y(s.vals[last])})).sort((a,b)=>a.yy-b.yy);
    for(let i=1;i<ends.length;i++) if(ends[i].yy-ends[i-1].yy<15) ends[i].yy=ends[i-1].yy+15;
    ends.forEach(e=>{g+=`<circle cx="${x(last).toFixed(1)}" cy="${y(e.s.vals[last]).toFixed(1)}" r="4" fill="var(${e.s.color})" stroke="var(--surface)" stroke-width="2"/><text x="${(x(last)+10).toFixed(1)}" y="${(e.yy+4).toFixed(1)}" class="val">${esc(e.s.label)}</text>`});
  }
  g+=`<line id="${id}-x" class="xhair" x1="0" x2="0" y1="${T}" y2="${T+ph}" visibility="hidden"/>`;
  g+=`<rect class="hit" data-chart="${id}" x="${L-6}" y="${T}" width="${pw+12}" height="${ph}"/>`;
  CH[id]={W,L,pw,n,last,days,series};
  return `<div class="chart" dir="ltr"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s=>s.label).join('، '))} يوميًا">${g}</svg></div>`;
}
function barPathLeft(x0,y,len,h){const r=Math.min(4,len/2,h/2);if(len<=0)return '';const xl=x0-len;return `M${x0},${y}H${xl+r}Q${xl},${y} ${xl},${y+r}V${y+h-r}Q${xl},${y+h} ${xl+r},${y+h}H${x0}Z`}
/* horizontal bars growing right-to-left from the label column, labels on the right */
function hBars(rows,series){
  const W=900,lab=260,valW=70,bh=series.length>1?12:16,gap=2,grpGap=series.length>1?18:10,ns=series.length;
  const gh=ns*bh+(ns-1)*gap,H=rows.length*(gh+grpGap)+grpGap;
  const max=niceMax(Math.max(0,...rows.flatMap(r=>r.vals)));
  const x0=W-lab-12,pw=x0-valW;let s='';
  rows.forEach((r,ri)=>{const top=grpGap/2+ri*(gh+grpGap);
    const nm=r.label.length>34?r.label.slice(0,33)+'…':r.label;
    s+=`<text x="${W-4}" y="${(top+gh/2+5).toFixed(1)}" text-anchor="end" class="lab">${esc(nm)}</text>`;
    r.vals.forEach((v,si)=>{const len=v>0?Math.max(2,v/max*pw):0,yy=top+si*(bh+gap);
      const tip=esc(r.label+'\n'+series[si].label+': '+fmt(v));
      s+=`<path d="${barPathLeft(x0,yy,len,bh)}" fill="var(${series[si].color})"/>${v?`<text x="${(x0-len-6).toFixed(1)}" y="${(yy+bh-2).toFixed(1)}" text-anchor="end" class="val">${fmtC(v)}</text>`:''}<rect x="${valW-60}" y="${yy-gap/2}" width="${x0-valW+60}" height="${bh+gap}" fill="transparent" data-tip="${tip}"/>`})});
  s+=`<line x1="${x0}" x2="${x0}" y1="0" y2="${H}" class="base"/>`;
  return `<div class="chart" dir="ltr"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s=>s.label).join('، '))}">${s}</svg></div>`;
}

function showTip(html,ev){const t=$('#tip');t.innerHTML=html;t.hidden=false;const w=t.offsetWidth,h=t.offsetHeight;let lx=ev.clientX+14,ly=ev.clientY+14;if(lx+w>innerWidth-8)lx=ev.clientX-w-14;if(ly+h>innerHeight-8)ly=ev.clientY-h-14;t.style.left=Math.max(8,lx)+'px';t.style.top=Math.max(8,ly)+'px'}

function vReport(){
  const f=draft.repFrom||shiftDay(day,-6), t=draft.repTo||day;
  const o=inRange('orders',f,t),s=inRange('sales',f,t),r=inRange('returns',f,t),is=inRange('issues',f,t),cl=inRange('collections',f,t);
  const rows=reportProducts(o,s,r), mats=reportMaterials(is), days=reportDays(o,s,r,f,t);
  const sv=s.reduce((a,x)=>a+gval(x),0), rv=r.reduce((a,x)=>a+gval(x),0);
  return `<section class="sec"><div class="sechead"><h2>تقرير فترة</h2></div>

  <div class="grid2"><section class="sec"><h3>المواد الأولية المصروفة</h3>${tbl('<th>المادة</th><th class="n">المصروف</th><th class="n">الرصيد الحالي</th>',mats.map(x=>`<tr><td>${esc(x.name)}</td><td class="n">${fmt(x.q)} <span class="muted">${esc(x.unit)}</span></td><td class="n">${fmt(x.bal)}</td></tr>`),'','لا يوجد صرف في هذه الفترة.')}</section>
  <section class="sec"><h3>يومًا بيوم</h3>${tbl('<th>اليوم</th><th class="n">طلبات</th><th class="n">مبيعات شامل الضريبة</th><th class="n">مرتجعات شامل الضريبة</th><th class="n">الصافي شامل الضريبة</th>',days.map(x=>`<tr><td>${x.d}</td><td class="n">${fmt(x.oq)}</td><td class="n">${fmt(x.sv)}</td><td class="n">${fmt(x.rv)}</td><td class="n">${fmt(x.sv-x.rv)}</td></tr>`),'','')}</section></div>`;
}
function reportProducts(o,s,r){const ids=[...new Set([...o,...s,...r].map(x=>x.productId))];return ids.map(id=>{const sum=(a,f)=>a.filter(x=>x.productId===id).reduce((t,x)=>t+f(x),0);return{name:pName(id),oq:sum(o,x=>num(x.qty)),sq:sum(s,x=>num(x.qty)),rq:sum(r,x=>num(x.qty)),sv:sum(s,x=>gval(x)),rv:sum(r,x=>gval(x)),sn:sum(s,nval),rn:sum(r,nval)}}).sort((a,b)=>(b.sv-b.rv)-(a.sv-a.rv))}
function reportMaterials(is){const t={};is.forEach(i=>(i.lines||[]).forEach(l=>{t[l.m]=(t[l.m]||0)+num(l.q)}));return Object.keys(t).map(id=>({name:mName(id),unit:mUnit(id),q:t[id],bal:materialBalance(id)})).sort((a,b)=>b.q-a.q)}
function reportDays(o,s,r,f,t){const out=[];let d=f,n=0;while(d<=t&&n<370){const on=x=>x.date===d;out.push({d,oq:o.filter(on).reduce((a,x)=>a+num(x.qty),0),sv:s.filter(on).reduce((a,x)=>a+gval(x),0),rv:r.filter(on).reduce((a,x)=>a+gval(x),0)});d=shiftDay(d,1);n++}return out.reverse()}

async function csv(kind){
  if(!downloads) return;
  const f=draft.repFrom||shiftDay(day,-6), t=draft.repTo||day;
  const o=inRange('orders',f,t),s=inRange('sales',f,t),r=inRange('returns',f,t),is=inRange('issues',f,t);
  let rows;
  if(kind==='products') rows=[['الصنف','مطلوب','مباع','مرتجع','قيمة المبيعات','قيمة المرتجع','الصافي'],...reportProducts(o,s,r).map(x=>[x.name,x.oq,x.sq,x.rq,x.sv,x.rv,x.sv-x.rv])];
  else if(kind==='materials') rows=[['المادة','الوحدة','المصروف','الرصيد الحالي'],...reportMaterials(is).map(x=>[x.name,x.unit,x.q,x.bal])];
  else rows=[['اليوم','طلبات','مبيعات','مرتجعات','الصافي'],...reportDays(o,s,r,f,t).map(x=>[x.d,x.oq,x.sv,x.rv,x.sv-x.rv])];
  const text='﻿'+rows.map(r=>r.map(c=>{c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n');
  try{await downloads.save({filename:`تقرير-${kind}-${f}-${t}.csv`,data:new Blob([text],{type:'text/csv'})})}catch(e){if(e&&e.code!=='dismissed'&&e.code!=='declined')toast('لم يكتمل التنزيل')}
}

    if(await put(f==='fSale'?'sales':'returns',rec)) toast(k==='s'?'تم تسجيل البيع':'تم تسجيل المرتجع');

  if(b.dataset.setpw){const id=b.dataset.setpw,inp=document.getElementById('np-'+id),pw=inp?inp.value:'';if(pw.length<6){toast('كلمة المرور المؤقتة لازم تكون 6 خانات على الأقل');return}
    b.disabled=true;const {error}=await SB.rpc('owner_set_password',{target:id,pw});b.disabled=false;
    if(error){toast('تعذر تعيين كلمة المرور');return}inp.value='';toast('تم تعيين كلمة المرور المؤقتة. أبلغ المستخدم بها، ويغيّرها بعد دخوله');return}
  if(b.dataset.rminvite){if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='تأكيد الحذف';setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent='حذف'}},3500);return}const {error}=await SB.from('invites').delete().eq('phone',b.dataset.rminvite);if(error){toast('تعذر الحذف');return}await loadProfiles();render();toast('حُذف الرقم من القائمة');return}
  if(b.dataset.rmprofile){if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='تأكيد الإزالة';setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent='إزالة'}},3500);return}const {error}=await SB.from('profiles').delete().eq('id',b.dataset.rmprofile);if(error){toast('تعذرت الإزالة');return}await loadProfiles();render();toast('أُزيل المستخدم');return}
  if(b.id==='copyLink'){try{await navigator.clipboard.writeText(APP_LINK());toast('تم نسخ الرابط')}catch(e){toast(APP_LINK())}return}
  if(b.id==='changeMyPin'){showAuth('newpw');return}
  if(b.id==='cancelNewPw'){unlock();return}
  if(b.id==='backLogin'){showAuth('login');return}
  if(b.id==='toSignup'){showAuth('signup');return}
  if(b.id==='forgotPw'){showAuth('forgot');return}
  if(b.id==='installApp'||b.id==='installApp2'){if(INSTALL_EVT){INSTALL_EVT.prompt();INSTALL_EVT.userChoice.then(c=>{if(c&&c.outcome==='accepted')b.hidden=true}).catch(()=>{});INSTALL_EVT=null}else installHelp();return}
  if(b.id==='copyAppLink'){const u=b.dataset.url;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>{b.textContent='تم النسخ ✓'}).catch(()=>{b.textContent=u});return}
  if(b.id==='closeInstallHelp'){const d=document.getElementById('installHelp');if(d)d.remove();return}
  if(b.id==='logout'){lockNow(true);return}
  if(b.id==='dlOrders'){downloadOrders();return}
  if(b.id==='dlOrdersPdf'){b.disabled=true;const t0=b.textContent;b.textContent='جارٍ تجهيز الملف…';downloadOrdersPdf().finally(()=>{b.disabled=false;b.textContent=t0});return}
  if(b.dataset.appr){const x=byId('orders',b.dataset.id);if(!x)return;if(await put('orders',{...x,approval:b.dataset.appr,approvedBy:ME||'',approvedAt:Date.now()},{flow:true}))toast(b.dataset.appr==='ok'?'تمت الموافقة وأُضيف الطلب إلى ملف اليوم':'تم رفض الطلب');return}
  if(b.dataset.ifilter){draft.itemFilter=b.dataset.ifilter;render();return}
  if(b.dataset.toggle){const x=byId(b.dataset.toggle,b.dataset.id);if(!x)return;if(await put(b.dataset.toggle,{...x,inactive:!x.inactive}))toast((x.inactive?'تم تفعيل ':'تم تعطيل ')+x.name);return}
  if(b.id==='addLine'){draft.issueLines.push({m:'',q:''});render();return}
  if(b.dataset.rmline!==undefined){draft.issueLines.splice(+b.dataset.rmline,1);if(!draft.issueLines.length)draft.issueLines=[{m:'',q:''}];reindex('il');render();return}
  if(b.id==='addBom'){draft.bom.push({m:'',q:''});render();return}
  if(b.id==='addCont'){(draft.cont=draft.cont||[]).push({p:'',n:''});render();return}
  if(b.dataset.rmcont!==undefined){draft.cont.splice(+b.dataset.rmcont,1);reindex('ct');render();return}
  if(b.id==='addIprod'){draft.issueProds.push({p:'',q:''});render();return}
  if(b.dataset.rmiprod!==undefined){draft.issueProds.splice(+b.dataset.rmiprod,1);if(!draft.issueProds.length)draft.issueProds=[{p:'',q:''}];reindex('ip');issueFromProds();render();return}
  if(b.id==='iprodFromOrders'){const F=orderFile(onDay('orders',day));if(!F.rows.length){toast('لا توجد طلبات في ملف هذا اليوم');return}draft.issueProds=F.rows.map(r=>({p:r.id,q:String(r.q)}));reindex('ip');issueFromProds();render();toast('تم تحميل طلبات اليوم وحساب المواد');return}
  if(b.id==='addCalc'){draft.calc.push({p:'',q:''});render();return}
  if(b.dataset.rmcalc!==undefined){draft.calc.splice(+b.dataset.rmcalc,1);if(!draft.calc.length)draft.calc=[{p:'',q:''}];reindex('cl');render();return}
  if(b.id==='saveRecipe'){b.disabled=true;await saveRecipe();b.disabled=false;return}
  if(b.id==='saveTargets'){b.disabled=true;await saveTargets();b.disabled=false;return}
  if(b.id==='toCalc'){b.disabled=true;await transferToCalc();b.disabled=false;return}
  if(b.id==='approveCalc'){if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='تأكيد الاعتماد';setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent='اعتماد الحسبة'}},4000);return}b.disabled=true;await approveCalc();return}
  if(b.id==='calcLoad'){const c=calcDoc(day);if(!c)return;draft.calc=c.lines.map(l=>({p:l.p,q:String(l.q)}));reindex('cl');render();setTimeout(()=>{const el=document.getElementById('cl-p-0');if(el)el.scrollIntoView({block:'center'})},50);return}
  if(b.id==='calcToIssue'){const c=calcDoc(day);if(!c)return;draft.issueProds=c.lines.map(l=>({p:l.p,q:String(l.q)}));reindex('ip');issueFromProds();view='issues';history.replaceState(null,'','#issues');render();window.scrollTo({top:0});toast('تم تحميل الحسبة في إذن الصرف');return}
  if(b.id==='calcClear'){draft.calc=[{p:'',q:''}];reindex('cl');render();return}
  if(b.id==='calcFromOrders'){const F=orderFile(onDay('orders',day));if(!F.rows.length){toast('لا توجد طلبات في ملف هذا اليوم');return}draft.calc=F.rows.map(r=>({p:r.id,q:String(r.q)}));reindex('cl');render();toast('تم تحميل طلبات اليوم');return}
  if(b.dataset.rmbom!==undefined){draft.bom.splice(+b.dataset.rmbom,1);reindex('b');render();return}
  if(b.dataset.issueFor){const o=byId('orders',b.dataset.issueFor);if(!o)return;draft.issueProds=[{p:o.productId,q:String(o.qty)}];reindex('ip');issueFromProds();view='issues';history.replaceState(null,'','#issues');render();window.scrollTo({top:0});return}
  if(b.dataset.editp){const p=byId('products',b.dataset.editp);if(!p)return;draft.editProduct=p.id;draft.bom=(p.bom||[]).map(l=>({m:l.m,q:String(l.q)}));draft.cont=(p.contents||[]).map(l=>({p:l.p,n:String(l.n)}));if(b.dataset.goitems){view='items';history.replaceState(null,'','#items')}skipRestore=true;render();window.scrollTo({top:0});return}
  if(b.dataset.editm){draft.editMaterial=b.dataset.editm;skipRestore=true;render();window.scrollTo({top:0});return}
  if(b.id==='cancelP'){draft.editProduct=null;draft.bom=[];draft.cont=[];skipRestore=true;render();return}
  if(b.id==='cancelM'){draft.editMaterial=null;skipRestore=true;render();return}
  if(b.dataset.receive){const id=b.dataset.receive,q=num(val('rc-'+id)),m=byId('materials',id);if(!m||q<=0){toast('أدخل كمية الوارد');return}clear(['rc-'+id]);if(await put('materials',{...m,opening:num(m.opening)+q}))toast('تمت إضافة الوارد إلى رصيد '+m.name);return}
  if(b.dataset.csv){csv(b.dataset.csv);return}
});
/* after removing a dynamic row, drop the stale captured ids so values come from draft */
function reindex(prefix){document.querySelectorAll(`[id^="${prefix}-"]`).forEach(el=>el.remove())}
window.addEventListener('hashchange',()=>{view=location.hash.slice(1)||'today';render();window.scrollTo({top:0})});
boot();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
